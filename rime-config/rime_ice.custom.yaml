    - derive/^bu/ub/
    - derive/^cu/uc/
    - derive/^du/ud/
    - derive/^fu/uf/
    - derive/^gu/ug/
    - derive/^hu/uh/
    - derive/^ju/uj/
    - derive/^ku/uk/
    - derive/^lu/ul/
    - derive/^mu/um/
    - derive/^nu/un/
    - derive/^ou/uo/
    - derive/^pu/up/
    - derive/^qu/uq/
