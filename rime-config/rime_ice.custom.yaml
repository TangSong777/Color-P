    - derive/^za/az/
    - derive/^ce/ec/
    - derive/^de/ed/
    - derive/^ge/eg/
    - derive/^he/eh/
    - derive/^ke/ek/
    - derive/^le/el/
    - derive/^me/em/
    - derive/^se/es/
    - derive/^te/et/
    - derive/^ye/ey/
    - derive/^ze/ez/
    - derive/^ai/ia/
    - derive/^bi/ib/
    - derive/^ci/ic/
    - derive/^di/id/
    - derive/^ei/ie/
    - derive/^ji/ij/
    - derive/^li/il/
