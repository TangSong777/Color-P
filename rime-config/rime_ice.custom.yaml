patch:
  # Process physical keypad literals before spelling and candidate selection.
  # The top keyboard row keeps its normal candidate-selection bindings.
  engine/processors:
    - lua_processor@*keypad_input
    - ascii_composer
    - recognizer
    - key_binder
    # Intercept physical keypad keys before spelling.  Top-row digits still
    # reach selector and remain candidate-selection keys.
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  # Among punctuation keys, only the unshifted main-row - and = page.
  # No bracket word-selection processor: [ and ] belong to the punctuator.
  key_binder/select_first_character: ""
  key_binder/select_last_character: ""
  key_binder/import_preset: null
  key_binder/bindings:
    - {accept: "Shift+Tab", send: "Shift+Left", when: composing}
    - {accept: Tab, send: "Shift+Right", when: composing}
    - {accept: "Alt+Left", send: "Shift+Left", when: composing}
    - {accept: "Alt+Right", send: "Shift+Right", when: composing}
    # Shift+Enter 与 Enter 一致：都走 commit_raw_input（上屏原始输入，不含 Rime
    # 自动插入的音节分隔符）。不绑定时 Shift+Enter 会落到默认路径，把
    # ni'hao'wo'shi 这种带分隔符的串原样上屏。
    - {accept: "Shift+Return", send: Return, when: composing}
    - {accept: minus, send: Page_Up, when: has_menu}
    - {accept: equal, send: Page_Down, when: has_menu}
    - {accept: "Control+Shift+3", toggle: ascii_punct, when: always}
    - {accept: "Control+Shift+numbersign", toggle: ascii_punct, when: always}
    - {accept: "Control+Shift+4", toggle: traditionalization, when: always}
    - {accept: "Control+Shift+dollar", toggle: traditionalization, when: always}

  # 英文输入的分层处理（按用户要求）：
  #   table_translator@melt_eng  -> 纯英文单词候选（hello / world ...）  已关闭
  #   table_translator@cn_en     -> 中英混排词条（X光 / T恤 / 红Buff）   保留
  # cn_en 的词库 en_dicts/cn_en.txt 共 1001 条，全部含中文，没有纯英文条目，
  # 所以开着它不会让英文单词冒出来。
  # 写法与上面的 processors 一致：用完整列表覆盖，顺序与 rime_ice.schema.yaml
  # 相同，只少了 melt_eng。其余翻译器（日期、农历、Unicode、计算器等）不变。
  engine/translators:
    - punct_translator
    - script_translator
    - lua_translator@*date_translator
    - lua_translator@*lunar
    - lua_translator@*uuid
    - table_translator@custom_phrase
    - table_translator@cn_en
    - table_translator@custom_phrase_complete
    - table_translator@radical_lookup
    - lua_translator@*unicode
    - lua_translator@*number_translator
    - lua_translator@*calc_translator
    - lua_translator@*force_gc

  # 关闭「时间戳」触发码。
  #
  # date_translator 把 ts 设为时间戳的触发码，而 ts 同时是 tangsong 等词的超级
  # 简拼，时间戳候选（quality=100）会挤到第一位，导致打 ts 第一个是十位数字。
  #
  # 注意不能只删这一项：脚本里写的是
  #     M.timestamp = config:get_string(...) or 'ts'
  # 取不到值时会回退到 'ts'，等于没关。必须显式置为空串——空串不可能是合法的
  # 输入码，因此脚本不会对任何输入产出时间戳。其余日期/时间/星期/ISO/中英日期
  # 触发码不受影响。
  date_translator/timestamp: ""


  # 前缀补全：拆成两层，避免单字母输入被英文占满。
  #
  #   精确码（chatgpt）→ custom_phrase        initial_quality 99 → 稳定首位
  #   前缀码（chat）   → custom_phrase_complete initial_quality 0.9 → 能选到但排在中文之后
  #
  # 为什么不能只给 custom_phrase 打开 enable_completion：补全出来的候选同样带
  # initial_quality 99，实测单字母输入会被英文吃光——
  #   g -> Gemini | GitHub | GitLab | Google | GPU（无一个中文）
  #   c -> ChatGPT | Claude | Copilot | CPU | 成（「成」掉到第 5）
  # 把补全放到权重 0.9（低于拼音的 1.2）后，中文优先，英文补全作为附加项出现。
  custom_phrase/enable_completion: false
  custom_phrase/initial_quality: 99
  custom_phrase_complete:
    dictionary: ""
    user_dict: custom_phrase
    db_class: stabledb
    enable_completion: true
    enable_sentence: false
    initial_quality: 0.9

  # 让 0-9 成为合法拼写字符，支持「拼音 + 数字/型号」混合造句，例如
  #   youyijianshiqingshishuo32meiyou26da -> 有一件事情是说32没有26大
  #   esp32bistm32haoyong                 -> ESP32比STM32好用
  #
  # 数字词条来自 numeric.dict.yaml（0..99999）与 mixed_tokens.dict.yaml（ESP32/STM32），
  # 都在 rime_ice.dict.yaml 的 import_tables 里。
  #
  # 数字进入 alphabet 后，主键盘数字本会被 speller 吃掉，所以 keypad_input.lua 里
  # 加了拦截：主键盘数字只用于选词，永不进入输入串；只有小键盘数字才作为拼写输入。
  speller/alphabet: "zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA`0123456789+-*/."

  # 把占位符 DASH 显示成连字符（配合 keypad_input 的 '-' 输入）
  engine/filters/+:
    - lua_filter@*dash_filter
    - lua_filter@*dedupe_filter
    # 抑制单字母前缀补全（u -> Ubuntu、i -> Intel），避免误触后整句被英文吃掉。
    - lua_filter@*short_prefix_filter
    # 英文候选的大小写双份：GitHub 之后紧跟 github。必须排在去重之后。
    - lua_filter@*lowercase_candidate_filter

  # 预编辑里把占位符 vvv 显示成连字符（与 dash_filter 对应）
  translator/preedit_format/+:
    - xform/vvv/-/
    - xform/vvu/_/

  # 韵母+声母打反时的派生拼写（uq -> qu、ab -> ba、ia -> ai ...）。
  # 拼音里这些组合都不是合法音节，只可能是手快打反了，所以安全；
  # 用 derive 给正确音节派生一个「颠倒写法」，不改变用户输入，
  # 因此继续输入（baba / jintian）完全不受影响。
  speller/algebra/+:
    - derive/^ba/ab/
    - derive/^ca/ac/
    - derive/^da/ad/
    - derive/^fa/af/
    - derive/^ga/ag/
    - derive/^ha/ah/
    - derive/^ka/ak/
    - derive/^la/al/
    - derive/^ma/am/
    - derive/^pa/ap/
    - derive/^sa/as/
    - derive/^ta/at/
